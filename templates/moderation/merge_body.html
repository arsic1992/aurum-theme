<div class="fx fx-meta">
	<!-- BEGIN switch_user_logged_in -->
	<p class="right rightside fx-meta__visit">{LAST_VISIT_DATE}</p>
	<!-- END switch_user_logged_in -->
	<p class="fx-meta__time">{CURRENT_TIME}</p>
</div>

<form action="{S_ACTION}" method="post" name="post" class="fx-mod__form">
<div class="panel fx fx-category fx-groups fx-groups--slim fx-fpanel fx-mpanel">
	<div class="inner"><span class="corners-top"><span></span></span>
	<h1 class="page-title fx fx-ptitle">{L_TITLE}</h1>
	<fieldset class="fields3 fx-mfields">
		<dl class="fx-field">
			<dt class="fx-field__label">
				<label>{L_FROM_TOPIC}</label><br />
				<span class="italic">{L_FROM_TOPIC_EXPLAIN}</span>
			</dt>
			<dd class="fx-field__control fx-mod__value"><strong>{FROM_TOPIC_TITLE}</strong></dd>
		</dl>
		<dl class="fx-field">
			<dt class="fx-field__label">
				<label>{L_TO_TOPIC}</label><br />
				<span class="italic">{L_TO_TOPIC_EXPLAIN}</span>
			</dt>
			<dd class="fx-field__control">
				{TO_TOPIC_TITLE}&nbsp;
				<input type="hidden" name="from_topic" value="{FROM_TOPIC}" />
				<input type="hidden" name="to_topic" value="{TO_TOPIC}" />
				<input class="button2 fx-mbtn" type="submit" name="select_to" value="{L_SEARCH}" />
			</dd>
		</dl>
	</fieldset>
	<span class="corners-bottom"><span></span></span></div>
</div>

<div class="panel row2 panel fx fx-category fx-groups fx-groups--slim fx-fpanel fx-mpanel fx-mpanel--bar">
	<div class="inner"><span class="corners-top"><span></span></span>
	<fieldset class="submit-buttons fx fx-groups fx-fbar">
		<input type="hidden" name="fid" value="{CURRENT_FID}" />
		<input class="button2 fx-mbtn fx-mbtn--ok" type="submit" name="submit" value="{L_SUBMIT}" />
		<input class="button2 fx-mbtn" type="submit" name="refresh" value="{L_REFRESH}" />
		{S_HIDDEN_FIELDS}
	</fieldset>
	<span class="corners-bottom"><span></span></span></div>
</div>
</form>
