<h1 class="page-title fx fx-viewhead">{L_VIEWING_PROFILE}</h1>
<div class="panel fx fx-category fx-groups fx-groups--slim fx-vpanel">
	<div class="inner"><span class="corners-top"><span></span></span>
	<div class="column1 fx-vcol">
	<p class="fx-rpgimg">{POSTER_RANK} {RPG_IMAGE}</p>
	<fieldset>
		<!-- BEGIN rpg_fields_left -->
		<dl class="fx-pfld">
			<dt class="fx-pfld__label"><label>{rpg_fields_left.F_NAME} :</label></dt>
			<dd class="fx-pfld__value">{rpg_fields_left.F_VALUE_NEW}</dd>
		</dl>
		<!-- END rpg_fields_left -->
	</fieldset>
	</div>
	<div class="column2 fx-vcol">
	<fieldset>
		<!-- BEGIN rpg_fields -->
		<dl class="fx-pfld">
			<dt class="fx-pfld__label"><label>{rpg_fields.F_NAME} :</label></dt>
			<dd class="fx-pfld__value">{rpg_fields.F_VALUE_NEW}</dd>
		</dl>
		<!-- END rpg_fields -->
	</fieldset>
	</div>
	<span class="corners-bottom"><span></span></span></div>
</div>
