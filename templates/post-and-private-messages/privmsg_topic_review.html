<!-- BEGIN switch_inline_mode -->
<h2 class="fx fx-ptitle fx-ptitle--small fx-histhead">{L_TOPIC_REVIEW}</h2>
<!-- END switch_inline_mode -->

<div class="fx fx-hist">
<!-- BEGIN postrow -->
<div class="panel {postrow.ROW_CLASS}{postrow.CURRENT_MSG} fx fx-histrow">
	<div class="inner fx-histrow__inner"><span class="corners-top"><span></span></span>
	<div class="fx-histrow__from"><dl class="postprofile fx-histrow__profile"><dt>{postrow.POSTER_AVATAR}<br /><span class="fx-histrow__name">{postrow.POSTER_NAME}</span></dt></dl></div>
	<div class="postbody fx-histrow__body">
		<div class="h3 fx-histrow__subject">{postrow.POST_SUBJECT_NEW}</div>
		<p class="author fx-histrow__meta"><img class="fx-histrow__mini" src="{postrow.MINI_POST_IMG}" alt="" /> {postrow.L_TOPIC_BY} {postrow.POSTER_NAME} {postrow.L_TOPIC_ON} {postrow.POST_DATE}</p>
		<div class="content fx-histrow__content">{postrow.MESSAGE}</div>
	</div>
	<span class="corners-bottom"><span></span></span></div>
</div>
<!-- END postrow -->
</div>
<div class="pagination fx fx-pagination">
    {PM_PAGINATION}
</div>
