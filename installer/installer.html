<div id="theme-installer" style="min-height:120px;padding:20px;text-align:center;color:#999">Loading the theme installer…</div>
<script>
(function () {
  // 1) WHERE THE INSTALLER CODE LIVES (one shared repo for every theme).
  //    It must contain installer/install.js and installer/catalog.json.
  //    Use a release tag or full commit SHA instead of 'main' so it can never change underneath people.
  var core = { owner: 'arsic1992', repo: 'aurum-theme', ref: 'main' };

  // 2) WHICH THEME REPOS CAN BE INSTALLED. Each needs a manifest.json in its root.
  //    One entry = the installer opens straight to that theme.
  //    Several entries = people pick one first (or link to the page with #id, e.g. #aurum).
  var themes = [
    { id: 'aurum', name: 'Aurum', description: 'Aurum theme for Forumotion', owner: 'arsic1992', repo: 'aurum-theme', ref: 'main' }
    // , { id: 'other', name: 'Other theme', description: 'Another look', owner: 'someone', repo: 'other-theme', ref: 'v1.0.0' }
  ];

  var theme = 'light';   // 'light', 'dark' or 'auto'; the header button overrides it
  // ---------------------------------------------------------------------------

  window.UNIVERSAL_INSTALLER = { core: core, themes: themes, theme: theme };
  var url = 'https://raw.githubusercontent.com/' + core.owner + '/' + core.repo + '/' + core.ref + '/installer/install.js';

  fetch(url).then(function (r) {
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    return r.text();
  }).then(function (code) {
    var s = document.createElement('script');
    s.text = code;
    document.head.appendChild(s);
  }).catch(function (e) {
    document.getElementById('theme-installer').textContent = 'Could not load the installer (' + e.message + '). Check that the repository is public and the ref exists.';
  });
})();
</script>
